name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build:
    name: Build - ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux x86_64
            target: x86_64-unknown-linux-gnu
            artifact_name: kindle-notes-parser
            asset_name: kindle-notes-parser-linux-x86_64

          - os: windows-latest
            platform: Windows x86_64
            target: x86_64-pc-windows-msvc
            artifact_name: kindle-notes-parser.exe
            asset_name: kindle-notes-parser-windows-x86_64.exe

          - os: macos-latest
            platform: macOS x86_64
            target: x86_64-apple-darwin
            artifact_name: kindle-notes-parser
            asset_name: kindle-notes-parser-macos-x86_64

          - os: macos-latest
            platform: macOS ARM64
            target: aarch64-apple-darwin
            artifact_name: kindle-notes-parser
            asset_name: kindle-notes-parser-macos-aarch64
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key:
            ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} --verbose

      - name: Rename Binary
        run:
          mv target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{
          matrix.asset_name }}
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Get Version
        id: version
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check Tag
        id: check_tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.version.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Artifacts
        if: steps.check_tag.outputs.exists == 'false'
        uses: actions/download-artifact@v7

      - name: Create Tag and Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          files: |
            **/kindle-notes-parser-*
          draft: false
          prerelease: false
