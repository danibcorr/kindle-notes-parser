[package]
name = "knp"
version = "0.2.6"
edition = "2024"
authors = ["Daniel Bazo Correa"]
license = "MIT"
description = "Kindle Notes Parser (knp) is a CLI tool written in Rust designed to extract and filter notes from your Kindle."
readme = "README.md"
homepage = "https://github.com/danibcorr/kindle-notes-parser"
repository = "https://github.com/danibcorr/kindle-notes-parser"
keywords = ["cli", "kindle"]
categories = ["command-line-utilities"]

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = true
strip = true

[dependencies]
clap = { version = "4.6.1", features = ["derive", "color", "suggestions"] }
console = "0.16.3"
ctrlc = "3.5.2"
dialoguer = "0.12.0"
